name: Compilar Videos APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Preparar Videos
        run: |
          python3 -m pip install --break-system-packages pillow numpy || python3 -m pip install pillow numpy
          python3 prepare_videos.py

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleStvideosRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Videos-APK
          path: smarttubetv/build/outputs/apk/stvideos/release/*.apk

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp smarttubetv/build/outputs/apk/stvideos/release/*armeabi-v7a.apk Videos.apk
          gh release delete videos --yes --cleanup-tag || true
          gh release create videos Videos.apk --title "Videos para Fire TV" --notes "APK de Videos para Fire TV" --latest
